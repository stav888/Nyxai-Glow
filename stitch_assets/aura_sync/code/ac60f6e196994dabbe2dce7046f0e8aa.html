      if (portraitFeed) {

  if (textureToggle) {

      if (isTextureActive) {
        textureToggle.className = 'w-12 h-7 rounded-full bg-primary p-0.5 transition-colors duration-200 focus:outline-none shadow-sm flex items-center';

      } else {

        toggleCircle.style.transform = 'translateX(0px)';
      }
    });
  }

  // Hold To Compare Micro-interaction
  const compareBtn = document.getElementById('compare-btn');
  if (compareBtn && portraitFeed) {
    const showBefore = () => {
      portraitFeed.style.filter = 'grayscale(15%) contrast(90%)';
      compareBtn.classList.add('bg-primary', 'text-on-primary');
    };
    const showAfter = () => {
      const val = slider ? slider.value : 45;
      const blurAmount = (val / 100) * 1.5;
      portraitFeed.style.filter = `blur(${blurAmount}px) brightness(${1 + (val / 100) * 0.05})`;
      compareBtn.classList.remove('bg-primary', 'text-on-primary');
    };

    compareBtn.addEventListener('mousedown', showBefore);
    compareBtn.addEventListener('mouseup', showAfter);
    compareBtn.addEventListener('touchstart', showBefore, { passive: true });
    compareBtn.addEventListener('touchend', showAfter, { passive: true });
  }

  // Reset Interaction
  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn && slider) {
    resetBtn.addEventListener('click', () => {
      slider.value = 0;
      slider.dispatchEvent(new Event('input'));
    });
  }

  // Apply & Save Flash Delight Feedback
  const applyBtn = document.getElementById('apply-btn');
  if (applyBtn) {
    applyBtn.addEventListener('click', () => {
      applyBtn.classList.add('scale-95', 'opacity-90');

      applyBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span class="font-label-lg text-label-lg uppercase tracking-wider">Synced</span>';
      setTimeout(() => {
        applyBtn.innerHTML = originalText;
        applyBtn.classList.remove('scale-95', 'opacity-90');
      }, 1200);
    });

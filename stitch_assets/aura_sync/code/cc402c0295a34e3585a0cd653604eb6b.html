<span class="material-symbols-outlined text-primary text-[14px]">check_circle</span>

<script>
  (function() {
    // Zoom Toggles
    const zoomBtns = document.querySelectorAll('.zoom-btn');
    const feed = document.getElementById('cameraFeed');
    zoomBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        zoomBtns.forEach(b => {
          b.classList.remove('bg-surface-container-high', 'text-primary', 'shadow-sm');
          b.classList.add('text-on-surface-variant');
        });
        btn.classList.add('bg-surface-container-high', 'text-primary', 'shadow-sm');
        btn.classList.remove('text-on-surface-variant');
        
        const zoom = btn.getAttribute('data-zoom');
        if (feed) {
          if (zoom === '0.5') feed.style.transform = 'scale(0.85)';
          else if (zoom === '1') feed.style.transform = 'scale(1)';
          else if (zoom === '2') feed.style.transform = 'scale(1.25)';
        }
      });
    });

    // Preset Toggles
    const presetBtns = document.querySelectorAll('.preset-pill');
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(p => {
          p.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-semibold', 'shadow-[0_2px_12px_rgba(255,154,139,0.3)]');
          p.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        });
        btn.classList.add('bg-primary-container', 'text-on-primary-container', 'font-semibold', 'shadow-[0_2px_12px_rgba(255,154,139,0.3)]');
        btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      });
    });

    // Flash Mode
    const flashBtn = document.getElementById('flashBtn');
    const flashIcon = document.getElementById('flashIcon');
    let flashIndex = 0;
    const flashModes = ['flash_off', 'flash_on', 'flash_auto'];
    flashBtn?.addEventListener('click', () => {
      flashIndex = (flashIndex + 1) % flashModes.length;
      if (flashIcon) {
        flashIcon.textContent = flashModes[flashIndex];
        if (flashModes[flashIndex] !== 'flash_off') {
          flashIcon.classList.remove('text-on-surface-variant');
          flashIcon.classList.add('text-primary');
        } else {
          flashIcon.classList.remove('text-primary');
          flashIcon.classList.add('text-on-surface-variant');
        }
      }
    });

    // Tap to focus on camera canvas
    const focusRing = document.getElementById('focusRing');
    feed?.parentElement?.addEventListener('click', (e) => {
      if (!focusRing) return;
      const rect = feed.parentElement.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      focusRing.style.left = `${x - 24}px`;
      focusRing.style.top = `${y - 24}px`;
      focusRing.style.transform = 'scale(1)';
      focusRing.style.opacity = '1';

      setTimeout(() => {
        focusRing.style.transform = 'scale(0.85)';
        setTimeout(() => {
          focusRing.style.opacity = '0';
        }, 500);
      }, 400);
    });

    // Shutter Trigger & Toast Micro-Interaction
    const shutter = document.getElementById('shutterTrigger');
    const toast = document.getElementById('toast');
    const shutterPulse = document.getElementById('shutterPulse');

    shutter?.addEventListener('click', () => {
      if (shutterPulse) {
        shutterPulse.classList.add('scale-125', 'opacity-0');
        setTimeout(() => {
          shutterPulse.classList.remove('scale-125', 'opacity-0');
        }, 300);
      }

      // Flash white screen simulation
      if (feed) {
        feed.style.filter = 'brightness(1.8) contrast(1.1)';
        setTimeout(() => {
          feed.style.filter = 'none';
        }, 120);
      }

      // Show toast
      if (toast) {
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0');
        }, 1800);
      }
    });

    // Flip Camera Rotation Animation
    const flipBtn = document.getElementById('switchCameraBtn');
    const flipIcon = document.getElementById('flipIcon');
    let rotated = false;
    flipBtn?.addEventListener('click', () => {
      rotated = !rotated;
      if (flipIcon) {
        flipIcon.style.transform = rotated ? 'rotate(180deg)' : 'rotate(0deg)';
      }
      if (feed) {
        feed.style.opacity = '0.3';
        setTimeout(() => {
          feed.style.opacity = '1';
        }, 220);
      }
    });

    // Compare original view
    const compareBtn = document.getElementById('compareBtn');
    compareBtn?.addEventListener('mousedown', () => {
      if (feed) feed.style.filter = 'grayscale(0.3) saturate(0.8) contrast(0.95)';
    });
    compareBtn?.addEventListener('mouseup', () => {
      if (feed) feed.style.filter = 'none';
    });
    compareBtn?.addEventListener('touchstart', () => {
      if (feed) feed.style.filter = 'grayscale(0.3) saturate(0.8) contrast(0.95)';
    });
    compareBtn?.addEventListener('touchend', () => {
      if (feed) feed.style.filter = 'none';
    });
  })();
